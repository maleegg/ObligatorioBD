services:
  db:
    image: mysql:8.0
    container_name: torneo_mysql_db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_spanish_ci --default-time-zone=-03:00
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword123"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: torneo_python_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=OBLIGATORIO
      - DB_LOGIN_USER=login_app
      - DB_LOGIN_PASSWORD=LoginApp_2026!
      - DB_ADMIN_USER=admin_torneo
      - DB_ADMIN_PASSWORD=Admin_Torneo_2026!
      - DB_PLANILLERO_USER=planillero_torneo
      - DB_PLANILLERO_PASSWORD=Planillero_2026!
      - SECRET_KEY=torneo-ucu-clave-de-sesion-2026
    ports:
      - "5001:5000"

volumes:
  mysql_data: