version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: torneo_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: torneo_interfacultades
      MYSQL_ROOT_PASSWORD: rootpassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword123"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: torneo_python_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword123
      - DB_NAME=torneo_interfacultades
      - DB_PORT=3306

volumes:
  mysql_data: